<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#0c0728"/>
      <stop offset="100%" stop-color="#1a0b36"/>
    </linearGradient>

    <!-- Waveform Gradients -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a54"/>
      <stop offset="100%" stop-color="#ff6b00"/>
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#003bff"/>
    </linearGradient>
    <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#ff007c"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animation CSS -->
    <style>
      @keyframes pulse {
        0%, 100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(2.2);
        }
      }
      @keyframes pulse-delayed {
        0%, 100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.8);
        }
      }
      @keyframes pulse-fast {
        0%, 100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(2.5);
        }
      }
      @keyframes float {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes glow-pulse {
        0%, 100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.6));
        }
      }
      .wave-bar {
        transform-origin: bottom;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      .wave-1 {
        animation-name: pulse;
        animation-duration: 1.5s;
      }
      .wave-2 {
        animation-name: pulse-delayed;
        animation-duration: 2s;
      }
      .wave-3 {
        animation-name: pulse-fast;
        animation-duration: 1.2s;
      }
      .floating-text {
        animation: float 6s ease-in-out infinite;
      }
      .glowing-element {
        animation: glow-pulse 3s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Subtle grid lines for tech look -->
  <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 300,0 L 300,400 M 600,0 L 600,400 M 900,0 L 900,400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Waveform Visualizer (Center Right) -->
  <g transform="translate(750, 200)" filter="url(#glow)">
    <!-- Main Voice wave representation -->
    <!-- Wave 1 (Orange/Red) -->
    <rect class="wave-bar wave-1" x="-120" y="-40" width="10" height="80" rx="5" fill="url(#wave-grad-1)" />
    <rect class="wave-bar wave-2" x="-100" y="-60" width="10" height="120" rx="5" fill="url(#wave-grad-1)" />
    <rect class="wave-bar wave-3" x="-80" y="-30" width="10" height="60" rx="5" fill="url(#wave-grad-1)" />
    
    <!-- Wave 2 (Cyan/Blue) -->
    <rect class="wave-bar wave-2" x="-60" y="-80" width="10" height="160" rx="5" fill="url(#wave-grad-2)" />
    <rect class="wave-bar wave-1" x="-40" y="-100" width="10" height="200" rx="5" fill="url(#wave-grad-2)" />
    <rect class="wave-bar wave-3" x="-20" y="-50" width="10" height="100" rx="5" fill="url(#wave-grad-2)" />
    
    <!-- Center Peak -->
    <rect class="wave-bar wave-1" x="0" y="-120" width="12" height="240" rx="6" fill="url(#wave-grad-3)" />
    
    <!-- Wave 3 (Purple/Magenta) -->
    <rect class="wave-bar wave-3" x="20" y="-60" width="10" height="120" rx="5" fill="url(#wave-grad-3)" />
    <rect class="wave-bar wave-2" x="40" y="-90" width="10" height="180" rx="5" fill="url(#wave-grad-3)" />
    <rect class="wave-bar wave-1" x="60" y="-40" width="10" height="80" rx="5" fill="url(#wave-grad-3)" />

    <!-- Wave 4 (Orange/Red) -->
    <rect class="wave-bar wave-2" x="80" y="-70" width="10" height="140" rx="5" fill="url(#wave-grad-1)" />
    <rect class="wave-bar wave-3" x="100" y="-40" width="10" height="80" rx="5" fill="url(#wave-grad-1)" />
    <rect class="wave-bar wave-1" x="120" y="-20" width="10" height="40" rx="5" fill="url(#wave-grad-1)" />
  </g>

  <!-- Glowing background elements -->
  <circle cx="950" cy="200" r="120" fill="#00f5ff" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="150" fill="#bd00ff" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Brand Typography (Left aligned) -->
  <g transform="translate(80, 0)">
    <!-- Small Category Label -->
    <text class="glowing-element" x="0" y="140" fill="#00f5ff" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="4">CURATED ECOSYSTEM</text>
    
    <!-- Main Title -->
    <g class="floating-text">
      <text x="0" y="195" fill="#ffffff" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="900" letter-spacing="1">AI Voice Agent</text>
      <text x="0" y="245" fill="#ffffff" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="900" letter-spacing="1">Platforms</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="295" fill="#a0a5c4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">SaaS &amp; Open-Source Conversational Voice Stacks</text>
  </g>
</svg>
